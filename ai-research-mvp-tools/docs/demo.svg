<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">AI Research MVP Tools Demo</title>
  <desc id="desc">Visual demo for summarization, peer review diagnostics, citation recommendations, and citation insertion.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
    .bg { fill: #fbfaf7; }
    .panel { fill: #fff; stroke: #ded9cc; stroke-width: 2; rx: 8; }
    .headline { font-size: 34px; font-weight: 700; }
    .small { font-size: 18px; }
    .label { font-size: 15px; fill: #6f6444; }
    .score { font-size: 38px; font-weight: 700; fill: #88691f; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }
  </style>
  <rect class="bg" width="960" height="540"/>
  <text x="48" y="64" class="headline">AI Research MVP Tools</text>
  <text x="48" y="96" class="small">Summaries · review diagnostics · citation recommendations</text>
  <rect x="48" y="132" width="260" height="150" class="panel"/>
  <text x="72" y="166" class="label">Summary Modes</text>
  <text x="72" y="214" class="score">3</text>
  <text x="72" y="250" class="small">abstract · executive · lay</text>
  <rect x="350" y="132" width="260" height="150" class="panel"/>
  <text x="374" y="166" class="label">Review Aid</text>
  <text x="374" y="214" class="score">ready</text>
  <text x="374" y="250" class="small">stats · ethics · similarity</text>
  <rect x="652" y="132" width="260" height="150" class="panel"/>
  <text x="676" y="166" class="label">Citation Tool</text>
  <text x="676" y="214" class="score">ranked</text>
  <text x="676" y="250" class="small">APA · MLA · Nature</text>
  <rect x="48" y="318" width="864" height="142" class="panel"/>
  <text x="72" y="354" class="label">Reviewer Output</text>
  <text x="72" y="388" class="mono">missing ethics + confidence interval checks, similarity evidence, citation insert actions</text>
  <text x="72" y="424" class="mono">Deterministic local heuristics keep the MVP runnable without external model credentials.</text>
</svg>
