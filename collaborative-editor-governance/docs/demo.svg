<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Collaborative Editor Governance Demo</title>
  <desc id="desc">Visual demo of collaborative scientific editor operations, locks, snapshots, and review dashboard.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
    .bg { fill: #f6f8fb; }
    .panel { fill: #fff; stroke: #d9dee8; stroke-width: 2; rx: 8; }
    .headline { font-size: 34px; font-weight: 700; }
    .small { font-size: 18px; }
    .label { font-size: 15px; fill: #596579; }
    .score { font-size: 38px; font-weight: 700; fill: #0f766e; }
    .warn { fill: #b45309; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }
  </style>
  <rect class="bg" width="960" height="540"/>
  <text x="48" y="64" class="headline">Collaborative Editor Governance</text>
  <text x="48" y="96" class="small">Operations · section locks · review dashboard · outline export</text>
  <rect x="48" y="132" width="260" height="150" class="panel"/>
  <text x="72" y="166" class="label">Operations</text>
  <text x="72" y="214" class="score">3 / 1</text>
  <text x="72" y="250" class="small">accepted / rejected</text>
  <rect x="350" y="132" width="260" height="150" class="panel"/>
  <text x="374" y="166" class="label">Review state</text>
  <text x="374" y="214" class="score warn">open</text>
  <text x="374" y="250" class="small">comment + suggestion</text>
  <rect x="652" y="132" width="260" height="150" class="panel"/>
  <text x="676" y="166" class="label">Snapshot</text>
  <text x="676" y="214" class="score">v1</text>
  <text x="676" y="250" class="small">content hash saved</text>
  <rect x="48" y="318" width="864" height="142" class="panel"/>
  <text x="72" y="354" class="label">Publication outline</text>
  <text x="72" y="388" class="mono">abstract · methods · results</text>
  <text x="72" y="424" class="mono">Locked methods edit from non-owner is rejected deterministically.</text>
</svg>
