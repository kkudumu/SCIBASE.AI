<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Revenue Metering Ledger Demo</title>
  <desc id="desc">Visual demo for subscription pricing, usage metering, licensing, and invoice readiness.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
    .bg { fill: #f7f8fb; }
    .panel { fill: #fff; stroke: #d9dee8; stroke-width: 2; rx: 8; }
    .headline { font-size: 34px; font-weight: 700; }
    .small { font-size: 18px; }
    .label { font-size: 15px; fill: #596579; }
    .score { font-size: 36px; font-weight: 700; fill: #0f766e; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }
  </style>
  <rect class="bg" width="960" height="540"/>
  <text x="48" y="64" class="headline">Revenue Metering Ledger</text>
  <text x="48" y="96" class="small">Subscriptions · compute usage · top-ups · analytics licensing</text>
  <rect x="48" y="132" width="260" height="150" class="panel"/>
  <text x="72" y="166" class="label">Plan decision</text>
  <text x="72" y="214" class="score">80 seats</text>
  <text x="72" y="250" class="small">annual + volume + coupon</text>
  <rect x="350" y="132" width="260" height="150" class="panel"/>
  <text x="374" y="166" class="label">Compute usage</text>
  <text x="374" y="214" class="score">$85.80</text>
  <text x="374" y="250" class="small">after included credits</text>
  <rect x="652" y="132" width="260" height="150" class="panel"/>
  <text x="676" y="166" class="label">Licensing</text>
  <text x="676" y="214" class="score">$350</text>
  <text x="676" y="250" class="small">redacted metadata export</text>
  <rect x="48" y="318" width="864" height="142" class="panel"/>
  <text x="72" y="354" class="label">Invoice packet</text>
  <text x="72" y="388" class="mono">{ provider: "institutional-invoice", entitlements, total, auditHash }</text>
  <text x="72" y="424" class="mono">Private project titles are excluded from licensed analytics exports.</text>
</svg>
