<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Scientific Bounty Arbitration Demo</title>
  <desc id="desc">Visual demo for challenge validation, arbitration scoring, and payout readiness.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
    .bg { fill: #f7f8fb; }
    .panel { fill: #fff; stroke: #d9dee8; stroke-width: 2; rx: 8; }
    .headline { font-size: 34px; font-weight: 700; }
    .small { font-size: 18px; }
    .label { font-size: 15px; fill: #596579; }
    .score { font-size: 38px; font-weight: 700; fill: #0f766e; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }
  </style>
  <rect class="bg" width="960" height="540"/>
  <text x="48" y="64" class="headline">Scientific Bounty Arbitration</text>
  <text x="48" y="96" class="small">Challenge validation · reviewer conflicts · payout readiness</text>
  <rect x="48" y="132" width="260" height="150" class="panel"/>
  <text x="72" y="166" class="label">Challenge</text>
  <text x="72" y="214" class="score">publishable</text>
  <text x="72" y="250" class="small">rubric totals 100</text>
  <rect x="350" y="132" width="260" height="150" class="panel"/>
  <text x="374" y="166" class="label">Arbitration</text>
  <text x="374" y="214" class="score">85.7</text>
  <text x="374" y="250" class="small">1 reviewer excluded</text>
  <rect x="652" y="132" width="260" height="150" class="panel"/>
  <text x="676" y="166" class="label">Payout</text>
  <text x="676" y="214" class="score">$1,000</text>
  <text x="676" y="250" class="small">60 / 40 team split</text>
  <rect x="48" y="318" width="864" height="142" class="panel"/>
  <text x="72" y="354" class="label">Sponsor packet</text>
  <text x="72" y="388" class="mono">{ decision: "award-recommended", payoutStatus: "ready" }</text>
  <text x="72" y="424" class="mono">IP transfer is recorded only after payout readiness is confirmed.</text>
</svg>
