<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Workspace Access Ledger Demo</title>
  <desc id="desc">Visual demo for identity, project access decisions, invitations, and audit governance.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
    .bg { fill: #f7f8fb; }
    .panel { fill: #fff; stroke: #d9dee8; stroke-width: 2; rx: 8; }
    .headline { font-size: 34px; font-weight: 700; }
    .small { font-size: 18px; }
    .label { font-size: 15px; fill: #596579; }
    .score { font-size: 38px; font-weight: 700; fill: #0f766e; }
    .warn { fill: #b45309; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }
  </style>
  <rect class="bg" width="960" height="540"/>
  <text x="48" y="64" class="headline">Workspace Access Ledger</text>
  <text x="48" y="96" class="small">Identity · profiles · project permissions · audit trail</text>
  <rect x="48" y="132" width="260" height="150" class="panel"/>
  <text x="72" y="166" class="label">Identity</text>
  <text x="72" y="214" class="score">3 users</text>
  <text x="72" y="250" class="small">ORCID + SAML metadata</text>
  <rect x="350" y="132" width="260" height="150" class="panel"/>
  <text x="374" y="166" class="label">Access decisions</text>
  <text x="374" y="214" class="score">2 / 1</text>
  <text x="374" y="250" class="small">allowed / denied</text>
  <rect x="652" y="132" width="260" height="150" class="panel"/>
  <text x="676" y="166" class="label">Governance</text>
  <text x="676" y="214" class="score warn">1 invite</text>
  <text x="676" y="250" class="small">hashed audit events</text>
  <rect x="48" y="318" width="864" height="142" class="panel"/>
  <text x="72" y="354" class="label">Policy example</text>
  <text x="72" y="388" class="mono">Reviewer can read a dataset by object rule, but cannot download it.</text>
  <text x="72" y="424" class="mono">Public manuscript read is allowed through visibility policy.</text>
</svg>
